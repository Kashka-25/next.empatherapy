<svg xmlns="http://www.w3.org/2000/svg" viewBox="290 30 930 890" width="930" height="890">
  <title>Empatherapy symbol: a cup of chamomile tea with honey and lemon</title>
  <!-- Vector redraw of Cassidy's teacup symbol (provisional until approved).
       Layers, by id, so the film can animate them: steam, back, tea, lemon, front, drip, flower. -->
  <defs>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3C04F"/><stop offset="1" stop-color="#E39B2A"/>
    </linearGradient>
    <linearGradient id="cupShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFBF3"/><stop offset="0.62" stop-color="#FCF4E6"/><stop offset="1" stop-color="#F3DFC0"/>
    </linearGradient>
    <linearGradient id="dripFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2B23C"/><stop offset="1" stop-color="#E8941F"/>
    </linearGradient>
    <clipPath id="teaClip"><ellipse cx="740" cy="447" rx="246" ry="57"/></clipPath>
  </defs>

  <g id="steam" fill="#5FA8A3" stroke="#5FA8A3" stroke-width="2" stroke-linejoin="round">
    <path d="M754 374 C 682 300, 692 250, 738 196 C 782 146, 792 102, 733 47 L 739 43 C 808 100, 800 154, 753 205 C 710 254, 700 300, 771 370 C 768 378, 758 378, 754 374 Z"/>
    <path d="M655 275 C 610 230, 620 176, 698 139 L 703 146 C 638 184, 628 230, 668 268 C 666 276, 659 278, 655 275 Z"/>
    <path d="M772 324 C 752 278, 794 246, 833 220 C 863 197, 861 176, 846 161 L 853 155 C 877 174, 878 205, 843 231 C 806 257, 770 282, 787 321 C 784 329, 776 329, 772 324 Z"/>
  </g>

  <g id="back">
    <!-- saucer -->
    <ellipse cx="727" cy="800" rx="370" ry="103" fill="#FBF3E4" stroke="#2F6699" stroke-width="13"/>
    <ellipse cx="732" cy="775" rx="300" ry="62" fill="#F6E6CC" opacity="0.8"/>
    <!-- handle -->
    <path d="M1022 455 C 1110 405, 1205 445, 1195 545 C 1186 630, 1080 668, 958 698" fill="none" stroke="#2F6699" stroke-width="13" stroke-linecap="round"/>
    <path d="M1020 522 C 1078 482, 1140 492, 1134 548 C 1128 604, 1060 630, 972 652" fill="none" stroke="#2F6699" stroke-width="13" stroke-linecap="round"/>
    <!-- cup body -->
    <path d="M444 418 C 448 560, 520 705, 626 762 Q 735 795 848 762 C 950 705, 1018 560, 1026 418 Z" fill="url(#cupShade)" stroke="#2F6699" stroke-width="13" stroke-linejoin="round"/>
    <!-- inside of the rim, back wall -->
    <ellipse cx="735" cy="420" rx="290" ry="84" fill="#F8EBD6"/>
  </g>

  <g id="tea">
    <ellipse cx="740" cy="447" rx="246" ry="57" fill="url(#tea)"/>
    <g clip-path="url(#teaClip)">
      <path d="M560 440 C 600 420, 690 418, 700 440 C 708 458, 650 465, 625 452 C 610 444, 640 432, 668 438" fill="none" stroke="#F8DE9B" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="740" cy="430" rx="246" ry="22" fill="#B87318" opacity="0.18"/>
    </g>
  </g>

  <g id="lemon">
    <path d="M752 492 A 110 110 0 0 1 972 492 Z" fill="#FFD95C" stroke="#F2B728" stroke-width="10" stroke-linejoin="round"/>
    <path d="M766 492 A 96 96 0 0 1 958 492 Z" fill="#FFE68A"/>
    <g stroke="#FFF6D6" stroke-width="7" stroke-linecap="round">
      <path d="M862 492 L 862 402"/><path d="M862 492 L 794 432"/><path d="M862 492 L 930 432"/>
      <path d="M862 492 L 774 476"/><path d="M862 492 L 950 476"/>
    </g>
  </g>

  <g id="front">
    <!-- front of the rim, drawn over the tea and lemon, with a gap where the honey spills over and at the back for the steam -->
    <path d="M444 418 C 444 470, 520 500, 590 507" fill="none" stroke="#2F6699" stroke-width="13" stroke-linecap="round"/>
    <path d="M702 513 C 800 517, 920 505, 990 470 C 1015 455, 1026 438, 1026 418" fill="none" stroke="#2F6699" stroke-width="13" stroke-linecap="round"/>
    <path d="M444 418 C 444 380, 560 340, 700 336" fill="none" stroke="#2F6699" stroke-width="13" stroke-linecap="round"/>
    <path d="M795 337 C 920 342, 1026 378, 1026 418" fill="none" stroke="#2F6699" stroke-width="13" stroke-linecap="round"/>
    <!-- rim thickness, inner line at the front -->
    <path d="M460 450 C 470 600, 560 720, 640 755" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  </g>

  <g id="drip">
    <path d="M588 500 C 600 506, 690 510, 704 506 C 694 520, 676 528, 672 548 C 668 566, 676 584, 664 596 C 650 608, 640 590, 646 572 C 650 556, 640 542, 632 548 C 624 556, 640 580, 640 600 C 640 624, 618 632, 608 618 C 598 604, 614 588, 614 566 C 614 540, 594 524, 588 500 Z" fill="url(#dripFill)" stroke="#F8D27A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M625 590 C 622 602, 628 612, 634 606" fill="none" stroke="#FFF2C8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g id="flower">
    <path d="M420 600 C 440 640, 470 690, 520 720" fill="none" stroke="#6E8C4A" stroke-width="7" stroke-linecap="round"/>
    <path d="M640 760 C 690 770, 740 780, 800 778" fill="none" stroke="#6E8C4A" stroke-width="7" stroke-linecap="round"/>
    <path d="M305 632 C 360 618, 420 640, 450 690 C 400 700, 340 680, 305 632 Z" fill="#7F9D55"/>
    <path d="M318 636 C 370 650, 410 668, 448 688" fill="none" stroke="#B9C98F" stroke-width="5" stroke-linecap="round"/>
    <path d="M700 768 C 740 720, 790 700, 828 696 C 812 740, 760 778, 700 768 Z" fill="#7F9D55"/>
    <path d="M706 766 C 750 742, 790 718, 822 700" fill="none" stroke="#B9C98F" stroke-width="5" stroke-linecap="round"/>
    <path d="M700 790 C 760 790, 820 800, 862 828 C 800 846, 740 830, 700 790 Z" fill="#7F9D55"/>
    <path d="M706 792 C 760 802, 812 814, 856 826" fill="none" stroke="#B9C98F" stroke-width="5" stroke-linecap="round"/>
    <!-- bud -->
    <path d="M412 612 C 400 580, 400 555, 410 548 C 430 540, 445 570, 438 600 Z" fill="#7F9D55"/>
    <ellipse cx="408" cy="572" rx="27" ry="31" fill="#F7C93F" stroke="#E9A92A" stroke-width="4"/>
    <path d="M392 590 C 400 560, 420 552, 432 562" fill="none" stroke="#FFF2B5" stroke-width="5" stroke-linecap="round"/>
    <!-- chamomile -->
    <g transform="translate(578 740)" fill="#FFFFFF" stroke="#2F6699" stroke-width="10" stroke-linejoin="round">
      <path d="M0 -12 C -46 -40, -48 -110, 0 -116 C 48 -110, 46 -40, 0 -12 Z"/>
      <path d="M0 -12 C -46 -40, -48 -110, 0 -116 C 48 -110, 46 -40, 0 -12 Z" transform="rotate(45)"/>
      <path d="M0 -12 C -46 -40, -48 -110, 0 -116 C 48 -110, 46 -40, 0 -12 Z" transform="rotate(90)"/>
      <path d="M0 -12 C -46 -40, -48 -110, 0 -116 C 48 -110, 46 -40, 0 -12 Z" transform="rotate(135)"/>
      <path d="M0 -12 C -46 -40, -48 -110, 0 -116 C 48 -110, 46 -40, 0 -12 Z" transform="rotate(180)"/>
      <path d="M0 -12 C -46 -40, -48 -110, 0 -116 C 48 -110, 46 -40, 0 -12 Z" transform="rotate(225)"/>
      <path d="M0 -12 C -46 -40, -48 -110, 0 -116 C 48 -110, 46 -40, 0 -12 Z" transform="rotate(270)"/>
      <path d="M0 -12 C -46 -40, -48 -110, 0 -116 C 48 -110, 46 -40, 0 -12 Z" transform="rotate(315)"/>
    </g>
    <g transform="translate(578 740)" stroke="#F3E3B8" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <path d="M0 -42 L 0 -92"/><path d="M0 -42 L 0 -92" transform="rotate(45)"/><path d="M0 -42 L 0 -92" transform="rotate(90)"/><path d="M0 -42 L 0 -92" transform="rotate(135)"/><path d="M0 -42 L 0 -92" transform="rotate(180)"/><path d="M0 -42 L 0 -92" transform="rotate(225)"/><path d="M0 -42 L 0 -92" transform="rotate(270)"/><path d="M0 -42 L 0 -92" transform="rotate(315)"/>
    </g>
    <circle cx="578" cy="740" r="42" fill="#F6B92C" stroke="#E79A1C" stroke-width="5"/>
    <circle cx="568" cy="728" r="12" fill="#FBD467" opacity="0.9"/>
  </g>
</svg>
